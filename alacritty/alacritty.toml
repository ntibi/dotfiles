[window]
opacity = 1.0
padding = { x = 0, y = 0 }

[scrolling]
history = 100000

[font]
normal = { family = "DejaVuSansM Nerd Font Mono", style = "Regular" }
bold = { family = "DejaVuSansM Nerd Font Mono", style = "Bold" }
italic = { family = "DejaVuSansM Nerd Font Mono", style = "Italic" }
bold_italic = { family = "DejaVuSansM Nerd Font Mono", style = "Bold Italic" }
size = 11.0

[bell]
animation = "Linear"
duration = 0

[colors.primary]
background = "#333333"
foreground = "#eeeeee"

[[keyboard.bindings]]
key = "Plus"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\n"
