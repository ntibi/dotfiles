$mod = SUPER

monitor=,preferred,auto,2

env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt5ct

exec-once = dunst
exec-once = waybar

$terminal = alacritty
$menu = wofi --show drun

input {
    kb_layout = us
    kb_options = compose:caps

    repeat_rate = 50
    repeat_delay = 150

    follow_mouse = 1

    touchpad {
	natural_scroll = false
	tap-to-click = true
	disable_while_typing = true
    }

    sensitivity = 0
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0

    col.active_border = rgba(555555ff)
    col.inactive_border = rgba(222222ff)

    #layout = dwindle

    allow_tearing = false
}

decoration {
    rounding = 0

    blur {
	enabled = true
	size = 3
	passes = 1
    }
}

animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 1, myBezier
    animation = windowsOut, 1, 1, default, popin 80%
    animation = border, 1, 1, default
    animation = borderangle, 1, 1, default
    animation = fade, 1, 1, default
    animation = workspaces, 1, 1, default
}

#dwindle {
    #pseudotile = true
    #preserve_split = true
#}

#master {
    #new_status = master
#}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    background_color = rgb(2f2f2f)
}

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

bind = $mod, Return, exec, $terminal
bind = $mod SHIFT, Return, exec, [float] $terminal --class scratchterm
bind = $mod, q, killactive,
bind = $mod, f, exec, firefox
bind = $mod SHIFT, f, exec, firefox --private-window

bind = $mod SHIFT, Space, togglefloating

bind = $mod, x, exec, $menu

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, h, movefocus, l
bind = $mod, j, movefocus, d
bind = $mod, k, movefocus, u
bind = $mod, l, movefocus, r

bind = $mod SHIFT, h, movewindow, l
bind = $mod SHIFT, j, movewindow, d
bind = $mod SHIFT, k, movewindow, u
bind = $mod SHIFT, l, movewindow, r

bind = $mod, v, layoutmsg, preselect l
bind = $mod, s, layoutmsg, preselect d
bind = $mod, z, fullscreen, 0
bind = $mod, t, togglegroup
bind = $mod SHIFT, t, changegroupactive
bind = $mod, w, togglesplit

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10
bind = $mod, grave, workspace, name:backtick

bind = $mod, semicolon, workspace, previous

bind = $mod SHIFT, 1, movetoworkspacesilent, 1
bind = $mod SHIFT, 2, movetoworkspacesilent, 2
bind = $mod SHIFT, 3, movetoworkspacesilent, 3
bind = $mod SHIFT, 4, movetoworkspacesilent, 4
bind = $mod SHIFT, 5, movetoworkspacesilent, 5
bind = $mod SHIFT, 6, movetoworkspacesilent, 6
bind = $mod SHIFT, 7, movetoworkspacesilent, 7
bind = $mod SHIFT, 8, movetoworkspacesilent, 8
bind = $mod SHIFT, 9, movetoworkspacesilent, 9
bind = $mod SHIFT, 0, movetoworkspacesilent, 10
bind = $mod SHIFT, grave, movetoworkspacesilent, name:backtick

bind = $mod, n, movecurrentworkspacetomonitor, +1
bind = $mod SHIFT, n, movecurrentworkspacetomonitor, -1
bind = $mod, Left, movecurrentworkspacetomonitor, l
bind = $mod, Right, movecurrentworkspacetomonitor, r
bind = $mod, Up, movecurrentworkspacetomonitor, u
bind = $mod, Down, movecurrentworkspacetomonitor, d

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n0 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n0 set 5%-

bind = , Print, exec, hyprshot -m window
bind = SHIFT, Print, exec, hyprshot -m region

bind = $mod, d, exec, dunstctl set-paused toggle
bind = CONTROL SHIFT, Space, exec, dunstctl close
bind = CONTROL SHIFT, period, exec, dunstctl context

bind = $mod SHIFT, r, exec, hyprctl reload
bind = $mod SHIFT, e, exit

bind = $mod, r, submap, resize
submap = resize
binde = , h, resizeactive, -10 0
binde = , j, resizeactive, 0 10
binde = , k, resizeactive, 0 -10
binde = , l, resizeactive, 10 0
binde = SHIFT, h, resizeactive, -50 0
binde = SHIFT, j, resizeactive, 0 50
binde = SHIFT, k, resizeactive, 0 -50
binde = SHIFT, l, resizeactive, 50 0
bind = CONTROL, h, moveactive, -10 0
bind = CONTROL, j, moveactive, 0 10
bind = CONTROL, k, moveactive, 0 -10
bind = CONTROL, l, moveactive, 10 0
bind = , g, moveactive, exact 0 0
bind = , z, centerwindow
bind = , equal, resizeactive, exact 50% 50%
bind = , equal, centerwindow
bind = , minus, resizeactive, exact 50% 50%
bind = , minus, centerwindow
bind = , escape, submap, reset
bind = , Return, submap, reset
submap = reset

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0
