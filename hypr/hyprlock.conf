general {
    disable_loading_bar = true
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(555555)
    inner_color = rgb(2f2f2f)
    font_color = rgb(ffffff)
    fade_on_empty = false
    placeholder_text = <span foreground="##ffffff">password</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(ffffff)
    font_size = 96
    font_family = monospace
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgb(aaaaaa)
    font_size = 24
    font_family = monospace
    position = 0, -150
    halign = center
    valign = center
}
